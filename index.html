<title>Code Odyssey – Your Computational Thinking Journey</title>
<style>
/* ==========================================================
   02-UI-SPEC-v3 – Complete CSS Stylesheet (verbatim)
   ========================================================== */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #090a16;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  color: #e0e0ff;
  overflow: hidden;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── VIEW SWITCHING ── */
.view-screen { display: none; width: 100vw; height: 100vh; flex-direction: column; }
.view-screen.active { display: flex; }

/* ── TOPBAR & BREADCRUMBS ── */
.app-topbar {
  background: linear-gradient(90deg, #111428, #1a1e3a);
  border-bottom: 2px solid #00d4ff33;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.app-logo {
  font-size: 20px; font-weight: 800;
  background: linear-gradient(90deg, #00d4ff, #a855f7);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.btn-nav {
  background: #1e1e3f; border: 1px solid #00d4ff44; color: #00d4ff;
  padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
}
.btn-nav:hover { background: #00d4ff22; border-color: #00d4ff; color: #fff; }

/* ── WORLD MAP SCREEN ── */
#world-map-canvas { flex: 1; width: 100%; height: 100%; cursor: pointer; }

/* ── ISLAND NODE SCREEN ── */
#island-canvas { flex: 1; width: 100%; height: 100%; cursor: pointer; }

/* ── WORKBENCH PUZZLE SCREEN ── */
#workbench-body { flex: 1; display: flex; overflow: hidden; }
#game-panel { flex: 62; position: relative; background: #070814; overflow: hidden; }
#gameCanvas { display: block; width: 100%; height: 100%; }

#objective-box {
  position: absolute; top: 14px; left: 14px;
  background: rgba(10, 12, 28, 0.85); border: 1px solid #00d4ff44;
  border-radius: 10px; padding: 12px 16px; font-size: 13px;
  backdrop-filter: blur(6px); max-width: 260px;
}
.obj-title { color: #00d4ff; font-weight: 700; text-transform: uppercase; font-size: 12px; margin-bottom: 6px; }
.obj-item { display: flex; align-items: center; gap: 8px; color: #ccc; margin-bottom: 4px; }
.obj-item.done { color: #666; text-decoration: line-through; }

/* ── VISUAL BLOCK PALETTE & WORKSPACE ── */
#block-panel { flex: 38; min-width: 360px; background: #0f1124; border-left: 2px solid #1e2242; display: flex; flex-direction: column; }
#category-tabs { display: flex; background: #0a0c1a; border-bottom: 1px solid #1e2242; overflow-x: auto; flex-shrink: 0; }
.cat-tab { padding: 10px 14px; font-size: 12px; font-weight: 700; color: #778; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.cat-tab.active { color: #00d4ff; border-bottom-color: #00d4ff; background: #0f1124; }

#block-palette { padding: 12px; display: flex; flex-wrap: wrap; gap: 8px; background: #0c0e1e; border-bottom: 1px solid #1e2242; min-height: 90px; }
#workspace-area { flex: 1; padding: 16px; overflow-y: auto; background: #090a18; border-inner: 1px solid #1a1c38; position: relative; }

/* Visual Blocks Styling */
.v-block {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 8px;
  font-family: monospace; font-size: 12px; font-weight: 700; color: #fff; cursor: grab; user-select: none;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); transition: transform 0.15s;
}
.v-block:active { cursor: grabbing; transform: scale(0.98); }
.v-block.exec-glowing { box-shadow: 0 0 16px #00ff88, 0 0 8px #fff; border-color: #00ff88; }

.v-block.cat-action   { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
.v-block.cat-control  { background: linear-gradient(135deg, #7c3aed, #6d28d9); }
.v-block.cat-variable { background: linear-gradient(135deg, #d97706, #b45309); }
.v-block.cat-sensor   { background: linear-gradient(135deg, #0284c7, #0369a1); }
.v-block.cat-world    { background: linear-gradient(135deg, #059669, #047857); }

.block-slot {
  min-height: 42px; border: 2px dashed #2a2e54; border-radius: 8px; margin-bottom: 8px;
  padding: 6px; display: flex; flex-direction: column; gap: 6px; background: rgba(255,255,255,0.02);
}
.block-slot.drag-over { border-color: #00d4ff; background: rgba(0,214,255,0.08); }

/* Controls & Console */
#workbench-controls { padding: 12px; background: #0a0c1a; border-top: 1px solid #1e2242; display: flex; gap: 10px; align-items: center; }
.btn-action { flex: 1; padding: 10px; border-radius: 8px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; color: #fff; }
#btnRun { background: linear-gradient(135deg, #00d4ff, #0088cc); }
#btnReset { background: #1e1e3f; color: #aaa; flex: 0.5; }

#console-output { height: 90px; background: #05060e; padding: 8px 12px; font-family: monospace; font-size: 11px; overflow-y: auto; border-top: 1px solid #1e2242; }
.con-log { margin-bottom: 4px; color: #889; }
.con-log.ok { color: #00ff88; }
.con-log.err { color: #ff5555; }
.con-log.info { color: #00d4ff; }

/* ==========================================================
   v3 additions (layout robustness, blocks, modals, iPad)
   ========================================================== */
html { height: 100%; }
body { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
@supports (height: 100dvh) { body, .view-screen { height: 100dvh; } }
#world-map-canvas, #island-canvas { display: block; min-height: 0; touch-action: manipulation; }
#workbench-body, #block-panel, #workspace-area { min-height: 0; }
button { font-family: inherit; }
.topbar-group { display: flex; align-items: center; gap: 10px; min-width: 0; }
.topbar-sub { color: #8890c0; font-size: 12px; }
.star-pill { background: #1a1d3a; border: 1px solid #ffd70055; color: #ffd700; padding: 5px 12px; border-radius: 20px; font-weight: 700; font-size: 13px; white-space: nowrap; }
.btn-nav.danger { color: #ff8a8a; border-color: #ff555544; }
.btn-nav.danger:hover { background: #ff555522; border-color: #ff5555; }
#island-title { font-weight: 800; font-size: 16px; color: #fff; text-align: center; }
.breadcrumbs { font-size: 13px; color: #99a; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; min-width: 0; }
.breadcrumbs a { color: #00d4ff; cursor: pointer; }
.breadcrumbs a:hover { text-decoration: underline; }
.breadcrumbs .sep { color: #556; }
.breadcrumbs .cur { color: #fff; font-weight: 700; }
#nav-header { gap: 12px; }

/* Objective box */
#objective-box { z-index: 4; max-height: calc(100% - 28px); overflow-y: auto; }
.obj-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; cursor: pointer; }
.obj-toggle { color: #667; font-size: 11px; }
#objective-box.collapsed .obj-body { display: none; }
.obj-name { color: #fff; font-weight: 800; font-size: 14px; margin-bottom: 4px; }
.obj-goal { color: #aab; font-size: 12px; margin-bottom: 10px; line-height: 1.4; }
.obj-item { font-size: 12px; line-height: 1.3; }
.obj-item .tick { width: 16px; flex-shrink: 0; text-align: center; color: #556; text-decoration: none; display: inline-block; }
.obj-item.done .tick { color: #00ff88; }
.obj-data { font-family: monospace; font-size: 11px; color: #ffd27a; margin-top: 8px; word-break: break-word; line-height: 1.5; }
.obj-meta { margin-top: 8px; font-size: 11px; color: #8890b0; border-top: 1px solid #ffffff14; padding-top: 6px; line-height: 1.5; }

#speech-bubble { position: absolute; display: none; background: #fff; color: #111; padding: 6px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; pointer-events: none; transform: translate(-50%, -100%); white-space: nowrap; box-shadow: 0 4px 12px rgba(0,0,0,.4); z-index: 5; }
#speech-bubble::after { content: ''; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-top-color: #fff; border-bottom: 0; }
#game-panel.shake { animation: shake .4s; }
@keyframes shake { 0%,100% { transform: none; } 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }

/* Blocks */
.blk { touch-action: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.blk-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.blk-icon { font-size: 13px; }
.v-block.c-block { display: flex; flex-direction: column; align-items: stretch; padding: 8px 10px; min-width: 210px; }
.c-block > .block-slot { margin: 6px 0 0 12px; background: rgba(0,0,0,.25); border-color: rgba(255,255,255,.2); min-height: 38px; }
.c-label { font-size: 11px; opacity: .85; margin-top: 6px; }
.block-slot > .blk { align-self: flex-start; }
.block-slot:empty::before { content: attr(data-hint); color: #4a4f80; font-size: 11px; font-family: 'Segoe UI', system-ui, sans-serif; padding: 4px 6px; font-weight: 600; }
.c-block > .block-slot:empty::before { color: rgba(255,255,255,.45); }
.blk-in { background: rgba(0,0,0,.35); color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 5px; padding: 3px 5px; font: 700 12px monospace; outline: none; min-width: 2.4em; -webkit-appearance: none; appearance: none; }
select.blk-in { padding: 3px 6px; cursor: pointer; }
select.blk-in option { background: #1a1d3a; color: #fff; }
.blk-in:focus { border-color: #00ff88; }
.cond-socket { display: inline-flex; align-items: center; min-width: 76px; min-height: 30px; border: 2px dashed rgba(255,255,255,.4); border-radius: 15px; padding: 2px; background: rgba(0,0,0,.25); }
.cond-socket:empty::before { content: 'condition'; color: rgba(255,255,255,.5); font-size: 10px; padding: 0 8px; font-family: 'Segoe UI', system-ui, sans-serif; }
.cond-socket.drag-over { border-color: #00ff88; background: rgba(0,255,136,.18); }
.v-block.chip { border-radius: 16px; padding: 4px 10px; }
.v-block.chip .v-block.chip { box-shadow: none; }
.v-block.chip.cat-sensor.logic { background: linear-gradient(135deg, #0e7490, #155e75); }
.v-block.dragging { position: fixed; z-index: 1000; pointer-events: none; opacity: .92; transform: rotate(2deg) scale(1.03); box-shadow: 0 14px 34px rgba(0,0,0,.6); margin: 0; }
.drop-marker { height: 4px; border-radius: 2px; background: #00d4ff; box-shadow: 0 0 8px #00d4ff; align-self: stretch; flex-shrink: 0; }
body.is-dragging, body.is-dragging * { cursor: grabbing !important; }
#workspace-area { touch-action: pan-y; }
#workspace-area.locked { pointer-events: none; }
#workspace-area.locked .blk-in { opacity: .8; }
.ws-head { display: flex; justify-content: space-between; font-size: 11px; color: #667; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.root-slot { min-height: calc(100% - 26px); border-style: solid; border-color: #1a1c38; margin-bottom: 0; }

/* Palette */
#category-tabs { scrollbar-width: none; }
#category-tabs::-webkit-scrollbar { display: none; }
.cat-tab { flex: 1 0 auto; text-align: center; padding: 10px 8px; }
.cat-tab .cnt { font-size: 10px; background: #1e2242; color: #99a; border-radius: 8px; padding: 1px 6px; margin-left: 4px; }
.cat-tab.active .cnt { background: #00d4ff33; color: #00d4ff; }
.cat-tab.empty { opacity: .4; }
#block-palette { position: relative; max-height: 36%; overflow-y: auto; align-content: flex-start; flex-shrink: 0; }
#block-palette .c-block { min-width: 0; }
#block-palette .block-slot { min-height: 14px; padding: 2px; }
#block-palette .block-slot::before { content: none; }
#block-palette .blk-in, #block-palette .cond-socket { pointer-events: none; }
#block-palette .cond-socket { min-width: 50px; min-height: 22px; }
#block-palette .blk:hover { transform: translateY(-1px); filter: brightness(1.12); }
.palette-empty { color: #556; font-size: 12px; padding: 8px 2px; }
#block-palette.trash-mode::after { content: '🗑  Drop here to delete'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(255,60,60,.12); border: 2px dashed #ff5555; color: #ff9090; font-weight: 800; font-size: 14px; border-radius: 6px; }
#block-palette.trash-mode.hot::after { background: rgba(255,60,60,.32); color: #fff; }

/* Controls */
.btn-icon { background: #1e1e3f; color: #ccd; border: 1px solid #2a2e54; border-radius: 8px; padding: 9px 10px; cursor: pointer; font-size: 14px; line-height: 1; }
.btn-icon:hover { border-color: #00d4ff; color: #fff; }
.btn-action:disabled { opacity: .5; cursor: not-allowed; }
.speed-ctl { display: flex; align-items: center; gap: 4px; font-size: 14px; }
.speed-ctl input { width: 72px; accent-color: #00d4ff; }
#workbench-controls { flex-wrap: wrap; }
.btn-action { white-space: nowrap; }
#btnRun { min-width: 110px; }
#btnReset { min-width: 84px; }

/* Victory overlay */
#victory-overlay { position: fixed; inset: 0; background: rgba(3,4,12,.75); display: none; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); padding: 16px; }
#victory-overlay.show { display: flex; }
.victory-card { max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow-y: auto; }
.victory-card { background: linear-gradient(160deg, #151936, #0d1024); border: 1px solid #00d4ff55; border-radius: 18px; padding: 26px 28px; width: min(440px, 100%); text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 40px #00d4ff22; animation: pop .35s ease-out; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.v-title { font-size: 22px; font-weight: 800; color: #fff; }
.v-sub { color: #99a; font-size: 13px; margin-top: 4px; }
.v-stars { font-size: 46px; letter-spacing: 8px; margin: 14px 0 6px; }
.v-star { display: inline-block; opacity: .18; filter: grayscale(1); transform: scale(.6); transition: all .35s cubic-bezier(.2,1.6,.4,1); }
.v-star.on { opacity: 1; filter: none; transform: scale(1); }
.v-score { color: #ffd700; font-weight: 800; font-size: 15px; margin-bottom: 12px; }
.v-stats { text-align: left; background: #0a0c1a; border: 1px solid #1e2242; border-radius: 10px; padding: 10px 14px; font-size: 13px; line-height: 1.8; }
.v-stats .ok { color: #00ff88; } .v-stats .no { color: #ff8080; }
.v-unlock { margin-top: 10px; color: #00ff88; font-weight: 700; font-size: 13px; min-height: 1em; }
.v-btns { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.v-btns button { flex: 1; min-width: 110px; }
.btn-primary { background: linear-gradient(135deg, #00d4ff, #0088cc); color: #fff; border: none; padding: 11px; border-radius: 9px; font-weight: 800; cursor: pointer; font-size: 14px; }
.btn-secondary { background: #1e1e3f; color: #ccd; border: 1px solid #2a2e54; padding: 11px; border-radius: 9px; font-weight: 700; cursor: pointer; font-size: 13px; }
.btn-secondary:hover { border-color: #00d4ff; color: #fff; }

#toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); background: #1a1d3a; border: 1px solid #ffd70066; color: #fff; padding: 12px 20px; border-radius: 12px; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: all .3s; z-index: 3000; max-width: calc(100vw - 32px); text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ── Captain's Briefing (brief-) & About window (about-) ── */
#briefing-overlay, #about-overlay { position: fixed; inset: 0; background: rgba(3,4,12,.78); display: none; align-items: center; justify-content: center; z-index: 2500; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); padding: 16px; }
#briefing-overlay.show, #about-overlay.show { display: flex; }
.brief-card, .about-card { background: linear-gradient(160deg, #151936, #0d1024); border: 1px solid #00d4ff55; border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 40px #00d4ff22; animation: pop .35s ease-out; max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); }
.brief-card { width: min(640px, 100%); display: flex; flex-direction: column; padding: 22px 24px 16px; min-height: 0; }
.brief-main { display: flex; gap: 18px; align-items: flex-start; flex: 1; min-height: 0; }
.brief-captain { width: 150px; flex-shrink: 0; }
.brief-captain svg, .about-captain svg { display: block; width: 100%; height: auto; overflow: visible; }
.cap-svg { animation: brief-bob 3s ease-in-out infinite; }
@keyframes brief-bob { 0%, 100% { transform: translateY(-4px); } 50% { transform: translateY(4px); } }
.cap-eye { transform-box: fill-box; transform-origin: center; animation: brief-blink 4.6s infinite; }
@keyframes brief-blink { 0%, 91%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.1); } }
.cap-mouth { transform-box: fill-box; transform-origin: center top; }
.brief-talking .cap-mouth { animation: brief-talk .2s ease-in-out infinite alternate; }
@keyframes brief-talk { from { transform: scaleY(.45); } to { transform: scaleY(1.35); } }
.brief-bubble { position: relative; flex: 1; min-width: 0; align-self: stretch; display: flex; flex-direction: column; min-height: 0; background: #0a0c1a; border: 1px solid #1e2242; border-radius: 14px; padding: 14px 16px; }
.brief-bubble::before { content: ''; position: absolute; left: -10px; top: 46px; border: 10px solid transparent; border-left: 0; border-right-color: #1e2242; }
.brief-bubble::after { content: ''; position: absolute; left: -8px; top: 47px; border: 9px solid transparent; border-left: 0; border-right-color: #0a0c1a; }
.brief-head { font-size: 11px; color: #8890b0; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.brief-title { color: #00d4ff; font-weight: 800; font-size: 17px; margin-bottom: 8px; line-height: 1.3; }
.brief-text { font-size: 15px; line-height: 1.5; color: #e0e0ff; min-height: 6em; overflow-y: auto; flex: 1 1 auto; }
.brief-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.brief-chip { background: #00d4ff18; border: 1px solid #00d4ff55; color: #cfefff; border-radius: 16px; padding: 6px 12px; font-size: 13px; font-weight: 700; }
.brief-foot { display: flex; align-items: center; gap: 10px; margin-top: 16px; flex-shrink: 0; }
.brief-dots { display: flex; gap: 7px; flex: 1; justify-content: center; }
.brief-dot { width: 9px; height: 9px; border-radius: 50%; background: #2a2e54; transition: all .25s; }

.brief-dot.past { background: #00d4ff77; }
.brief-skip { background: none; border: none; color: #8890b0; font-weight: 700; font-size: 14px; cursor: pointer; min-height: 44px; padding: 0 10px; }
.brief-skip:hover { color: #fff; }
.brief-foot .btn-primary, .brief-foot .btn-secondary { min-height: 44px; min-width: 112px; }
.about-card { position: relative; width: min(560px, 100%); display: flex; flex-direction: column; overflow: hidden; }
.about-scroll { overflow-y: auto; padding: 22px 24px 20px; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: #2a2e54 transparent; }
.about-close { position: absolute; top: 10px; right: 10px; width: 44px; height: 44px; border-radius: 50%; background: #1e1e3f; border: 1px solid #2a2e54; color: #ccd; font-size: 18px; cursor: pointer; z-index: 1; }
.about-close:hover { border-color: #00d4ff; color: #fff; }
.about-header { display: flex; gap: 14px; align-items: center; padding-right: 44px; }
.about-captain { width: 72px; flex-shrink: 0; }
.about-name { font-size: 26px; }
.about-tagline { color: #aab4d8; font-size: 14px; margin-top: 2px; }
.about-version { color: #8890b0; font-size: 12px; margin-top: 4px; }
.about-h { color: #00d4ff; font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; margin: 20px 0 8px; }

.about-pillar { background: #0a0c1a; border: 1px solid #1e2242; border-radius: 10px; padding: 10px 12px; font-size: 13px; color: #aab4d8; line-height: 1.4; }

.about-islands { list-style: none; display: flex; flex-direction: column; gap: 4px; }
.about-isl { display: flex; align-items: center; gap: 10px; background: #0a0c1a; border: 1px solid #1e2242; border-radius: 8px; padding: 6px 10px; font-size: 13px; }

// ---------- Star Evaluation & Unlocking ----------
function onSubstageVictory(subId, stepsUsed, blocksUsed) {
  const meta = SUBSTAGE_DATA[subId];
  let stars = 1; // 1 star for clearing puzzle
  if (stepsUsed <= meta.targetSteps) stars++;
  if (blocksUsed <= meta.optimalBlocks) stars++;
  const prevBest = APP_STATE.completedSubstages[subId] || 0;
  APP_STATE.completedSubstages[subId] = Math.max(prevBest, stars);
  APP_STATE.totalStars = Object.values(APP_STATE.completedSubstages).reduce((a, b) => a + b, 0);
  // Check Island completion -> Unlock next Island
  const currentIsland = parseInt(subId.split('.')[0], 10);
  const islandSubIds = [`${currentIsland}.1`, `${currentIsland}.2`, `${currentIsland}.3`];
  const allSubCleared = islandSubIds.every(id => (APP_STATE.completedSubstages[id] || 0) >= 1);
  let newIsland = null;
  if (allSubCleared && currentIsland < 12 && !APP_STATE.unlockedIslands.includes(currentIsland + 1)) {
    APP_STATE.unlockedIslands.push(currentIsland + 1); newIsland = currentIsland + 1;
  }
  saveProgressToStorage();
  updateHeaders();
  showVictoryOverlay(subId, stars, { stepsUsed, blocksUsed, prevBest, newIsland });
}

function showIslandTip(islandId, mode) {
  const tip = $('island-tip'), isl = WORLD_ISLANDS[islandId - 1], brief = ISLAND_BRIEFS[islandId];
  if (!isl || !brief || !UI.wmT || BRIEF.open || aboutOpen) return;
  if (!$('tip-captain').firstChild) $('tip-captain').innerHTML = CAPTAIN_SVG;
  const unlocked = isIslandUnlocked(islandId), stars = islandStars(islandId), verb = mode === 'touch' ? 'Tap' : 'Click';
  $('tip-title').textContent = `${isl.icon} Island ${isl.id} · ${isl.name}`;
  $('tip-concept').textContent = isl.concept;
  $('tip-objective').textContent = brief.objective;
  $('tip-outcome').textContent = brief.outcome;
  const st = $('tip-status');
  st.textContent = !unlocked ? `🔒 Locked – clear Island ${islandId - 1} to unlock`
    : isIslandComplete(islandId) ? `✅ Island complete · ⭐ ${stars}/9 · ${verb} to replay`
    : `⭐ ${stars}/9 · ${verb} to set sail`;
  st.classList.toggle('locked', !unlocked);
  // Position beside the island (right side preferred), flipping or dropping below when space runs out
  const cv = $('world-map-canvas'), r = cv.getBoundingClientRect(), vt = UI.wmT, P = islandXY(isl);
  const sx = r.left + vt.ox + P.x * vt.s, sy = r.top + vt.oy + P.y * vt.s, rr = 46 * 1.25 * vt.s, gap = 8, M = 8;
  tip.classList.remove('flip', 'below');
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = sx + rr + gap, top = sy - 34;
  if (left + tw > innerWidth - M) { left = sx - rr - gap - tw; tip.classList.add('flip'); }
  if (left < M) { // no room at either side (narrow phones): centre it above or below the island
    tip.classList.remove('flip'); tip.classList.add('below');
    left = Math.min(Math.max(M, sx - tw / 2), innerWidth - tw - M);
    top = sy + rr * 0.8 + th + gap < innerHeight - M ? sy + rr * 0.8 + gap : sy - rr * 0.8 - th - gap;
  }
  top = Math.min(Math.max(M, top), innerHeight - th - M);
  tip.style.left = Math.round(left) + 'px'; tip.style.top = Math.round(top) + 'px';
  if (TIP.id !== islandId) { tip.classList.remove('show'); void tip.offsetWidth; } // restart the fade for a new island
  tip.classList.add('show');

function bindCanvasNav() {

  const overlayOpen = () => BRIEF.open || aboutOpen;
  // Hover (mouse / pen): Captain Algo's island tip fades in; touch: long-press shows it, a normal tap still opens the island
  let longPress = null, suppressClick = false;
  const cancelLongPress = () => { if (longPress) { clearTimeout(longPress.timer); longPress = null; } };
  wm.addEventListener('pointermove', e => {
    if (overlayOpen()) return;
    const id = hitIsland(e);
    if (longPress && Math.hypot(e.clientX - longPress.x, e.clientY - longPress.y) > 10) cancelLongPress();
    if (id !== UI.hoverIsland && e.pointerType !== 'touch') { if (id) showIslandTip(id, 'hover'); else hideIslandTip(); }
    UI.hoverIsland = id; wm.style.cursor = id ? 'pointer' : 'default';
  });
  wm.addEventListener('pointerleave', () => { UI.hoverIsland = null; cancelLongPress(); if (TIP.mode === 'hover') hideIslandTip(); });
  wm.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch' || overlayOpen()) return;
    hideIslandTip(); cancelLongPress();
    const id = hitIsland(e); if (!id) return;
    longPress = { x: e.clientX, y: e.clientY, timer: setTimeout(() => { longPress = null; suppressClick = true; showIslandTip(id, 'touch'); }, 450) };
  });
  wm.addEventListener('pointerup', cancelLongPress);
  wm.addEventListener('pointercancel', cancelLongPress);
  wm.addEventListener('click', e => {

  window.addEventListener('resize', hideIslandTip);
  const hitNode = e => { if (!UI.ivT) return null; const p = toLogical(iv, UI.ivT, e); const k = nodePositions().findIndex(n => Math.hypot(p.x - n.x, p.y - n.y) < 46 || (Math.abs(p.x - n.x) < 95 && p.y > n.y + 40 && p.y < n.y + 120)); return k >= 0 ? k : null; };

  iv.addEventListener('pointerleave', () => { UI.hoverNode = null; });

}

function updateLayoutVars() { // lets the tabletop-fold layout put the puzzle exactly on the top screen

</script>
